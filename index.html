<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0A0A0A" />
    <meta name="description" content="Notch Cloud Services — دومينات، إيميلات أعمال، تصميم مواقع، استضافة وخدمات كلاود في مكان واحد." />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <title>Notch Cloud Services | نوتش كلاود</title>
    <script>
      /* Boot diagnostics (plain ES5, runs before the app): if the app never renders, show why instead of a blank page. */
      (function () {
        var errs = [];
        function add(m) { errs.push(String(m).slice(0, 300)); }
        window.addEventListener('error', function (e) {
          var t = e.target;
          if (t && t !== window && (t.src || t.href)) add('LOAD FAILED: ' + (t.src || t.href));
          else add((e.message || 'error') + (e.filename ? ' @ ' + e.filename.split('/').pop() + ':' + e.lineno : ''));
        }, true);
        window.addEventListener('unhandledrejection', function (e) { add('Promise: ' + ((e.reason && e.reason.message) || e.reason)); });
        function el(tag, text, css) { var n = document.createElement(tag); if (text) n.textContent = text; if (css) n.style.cssText = css; return n; }
        function show() {
          var root = document.getElementById('root');
          if (!root || root.childNodes.length) return;
          var ar = (navigator.language || '').indexOf('ar') === 0;
          var box = el('div', '', 'max-width:660px;margin:40px auto;padding:24px;font:15px/1.7 system-ui,Tahoma,sans-serif;border:1px solid #ddd;border-radius:20px;background:#fff;color:#0a0a0a');
          box.dir = ar ? 'rtl' : 'ltr';
          box.appendChild(el('h2', ar ? 'الموقع لم يُحمَّل' : 'The site failed to load', 'margin:0 0 8px;font-size:20px'));
          var isSource = !!document.querySelector('script[src*="/src/"]') || errs.join(' ').indexOf('/src/main.tsx') > -1;
          if (isSource) {
            box.appendChild(el('p', ar
              ? 'هذه ملفات المصدر (src/main.tsx) وليست الموقع المبني، ولا يمكن للمتصفح تشغيلها. لا ترفع الريبو كما هو: ارفع ملف release/install.php فقط وافتحه من المتصفح، أو ارفع محتوى فولدر dist بعد npm run build.'
              : 'These are the source files (src/main.tsx), not the built site, and browsers cannot run them. Do not deploy the repo as is: upload release/install.php only and open it in the browser, or upload the contents of dist after npm run build.',
              'margin:0 0 12px;padding:12px;background:#fbeaed;color:#b00020;border-radius:12px;font-weight:600'));
          }
          box.appendChild(el('p', location.protocol === 'file:'
            ? (ar ? 'أنت فاتح الملف من جهازك مباشرة (file://). ارفعه على استضافة أو شغّل npm run preview.' : 'You opened the file straight from disk (file://). Upload it to a host or run npm run preview.')
            : (ar ? 'ابعت لقطة من هذه الصفحة للدعم. الأسطر التالية تحدد السبب.' : 'Send a screenshot of this page to support. The lines below show the cause.'), 'margin:0 0 12px;color:#555'));
          var pre = el('pre', '', 'margin:0;padding:12px;background:#f4f4f2;border-radius:12px;white-space:pre-wrap;word-break:break-all;font:12px/1.6 ui-monospace,Menlo,Consolas,monospace;direction:ltr;text-align:left');
          pre.textContent = 'URL: ' + location.href + '\nBrowser: ' + navigator.userAgent + '\nErrors: ' + (errs.length ? '\n - ' + errs.join('\n - ') : 'none captured');
          box.appendChild(pre);
          root.appendChild(box);
          var nodes = document.querySelectorAll('script[src],link[rel=stylesheet]');
          Array.prototype.forEach.call(nodes, function (n) {
            var u = n.src || n.href;
            if (!window.fetch) return;
            fetch(u).then(function (r) { pre.textContent += '\nCHECK ' + u.split('/').slice(-2).join('/') + ' -> ' + r.status + ' ' + (r.headers.get('content-type') || ''); })
              .catch(function (e) { pre.textContent += '\nCHECK ' + u + ' -> ' + e; });
          });
        }
        window.addEventListener('load', function () { setTimeout(show, 3000); });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript style="display:block;padding:24px;font:16px system-ui">يلزم تفعيل JavaScript لتشغيل الموقع. / Please enable JavaScript.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
